<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfolio de Prénom Nom, apprenant développeur web.">
  <title>Abdelali-Portfolio</title>

  <!-- Police Inter (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ========== EN-TÊTE ========== -->
  <header class="en-tete">
    <div class="conteneur en-tete__contenu">
      <a class="logo" href="page1index.html">Portfolio</a>
      <nav aria-label="Navigation principale">
        <ul class="menu">
          <li><a href="page1index.html">Présentation</a></li>
          <li><a href="page2competance.html">A propos</a></li>
          <li><a href="page3projets.html">Projets</a></li>
          <li><a href="page4contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>

    <!-- ========== CONTACT ========== -->
    <section id="contact" class="section section--claire">
      <div class="conteneur">
        <h2>Contact</h2>
        <p class="section__intro">Une question, une proposition ? Écrivez-moi.</p>

        <form class="formulaire" action="#" method="post">
          <label for="nom">Nom</label>
          <input id="nom" name="nom" type="text" required placeholder="votre nom">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" type="text" required placeholder="votre adress email">
          <label for="sujet">Sujet</label>
          <input id="sujet" name="sujet" type="text" required >
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>

          <button class="bouton" type="submit">Envoyer</button>
        </form>

        <ul class="reseaux">
          <li><a class="lien" href="https://github.com/"><u>GitHub</u></a></li>
          <li><a class="lien" href="https://www.linkedin.com/"><u>LinkedIn</u></a></li>
        </ul>
      </div>
    </section>

  </main>

  <!-- ========== PIED DE PAGE ========== -->
  <footer class="pied">
    <div class="conteneur">
      <p>© 2026 Abdelali. Tous droits réservés.</p>
    </div>
  </footer>
</body>
</html>
